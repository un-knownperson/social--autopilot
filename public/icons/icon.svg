<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Central Icon Symbol (Layers & AutoPilot Winged Flow) -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Layer / Plane -->
    <path d="M256 128 L392 200 L256 272 L120 200 Z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Middle Layer -->
    <path d="M140 248 L256 312 L372 248" />
    <!-- Bottom Layer -->
    <path d="M160 296 L256 352 L352 296" />
    <!-- Pulse Sparkle / Automation Nodes -->
    <circle cx="256" cy="200" r="16" fill="url(#glowGrad)" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
